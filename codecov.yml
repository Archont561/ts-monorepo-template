# Generated by `mcoverage sync` (configs/coverage) — do not edit.
# Refreshed on every `bun install` (prepare) and by `bun run docs:sync`.
codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    # Overall monorepo gate — mirrors COVERAGE_THRESHOLD.
    project:
      default:
        target: 80%
        threshold: 1%
    # Patch coverage on PRs.
    patch:
      default:
        target: 80%
        threshold: 5%

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: 80%
        threshold: 1%

component_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
        threshold: 2%
  individual_components:
    - component_id: example
      name: apps/example
      paths:
        - "apps/example/**"
    - component_id: citty
      name: configs/citty
      paths:
        - "configs/citty/**"
    - component_id: coverage
      name: configs/coverage
      paths:
        - "configs/coverage/**"
    - component_id: manifest
      name: configs/manifest
      paths:
        - "configs/manifest/**"
    - component_id: native-config
      name: configs/native
      paths:
        - "configs/native/**"
    - component_id: template
      name: configs/template
      paths:
        - "configs/template/**"
    - component_id: unocss
      name: configs/unocss
      paths:
        - "configs/unocss/**"
    - component_id: external
      name: packages/external
      paths:
        - "packages/external/**"
    - component_id: internal
      name: packages/internal
      paths:
        - "packages/internal/**"

comment:
  layout: "reach,diff,flags,components,tree"
  behavior: default
  require_changes: true
  show_carryforward_flags: true
