# Generated by `m coverage sync` (packages/tooling) — do not edit.
# Refreshed on every `bun install` (prepare) and by `bun run docs:sync`.
codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    # Overall monorepo gate — mirrors COVERAGE_THRESHOLD.
    project:
      default:
        target: 80%
        threshold: 1%
    # Patch coverage on PRs.
    patch:
      default:
        target: 80%
        threshold: 5%

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: 80%
        threshold: 1%

component_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
        threshold: 2%
  individual_components:
    - component_id: example
      name: apps/example
      paths:
        - "apps/example/**"
    - component_id: external
      name: packages/external
      paths:
        - "packages/external/**"
    - component_id: internal
      name: packages/internal
      paths:
        - "packages/internal/**"
    - component_id: tooling
      name: packages/tooling
      paths:
        - "packages/tooling/**"

comment:
  layout: "reach,diff,flags,components,tree"
  behavior: default
  require_changes: true
  show_carryforward_flags: true
