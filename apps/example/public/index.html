<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bun Monorepo Example</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        min-height: 100vh;
        margin: 0;
        background: #09090b;
        color: #fafafa;
      }
      header {
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        letter-spacing: -0.02em;
      }
      header p {
        margin: 0;
        color: #a1a1aa;
      }
      #greeting {
        padding: 2rem 3rem;
        border: 1px solid #27272a;
        border-radius: 0.5rem;
        background: #18181b;
        font-size: 1.5rem;
      }
      nav {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      nav a {
        padding: 0.75rem 1rem;
        border: 1px solid #27272a;
        border-radius: 0.5rem;
        background: #18181b;
        color: #fafafa;
        text-decoration: none;
        font-size: 0.875rem;
      }
      nav a:hover {
        border-color: #3f3f46;
      }
      footer {
        color: #71717a;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bun Monorepo</h1>
      <p>Powered by Bun + Turborepo</p>
    </header>

    <div id="greeting">Hello, World!</div>

    <nav>
      <a href="/api">API index</a>
      <a href="/api/greet/World">/api/greet/:name</a>
      <a href="/health">/health</a>
      <!-- TEMPLATE-ONLY:START(native) -->
      <a href="/api/native">Native bindings (Rust)</a>
      <!-- TEMPLATE-ONLY:END(native) -->
    </nav>

    <footer>Built with Bun and Turborepo</footer>
  </body>
</html>
