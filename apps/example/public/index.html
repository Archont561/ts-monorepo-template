<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bun Monorepo Example</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
