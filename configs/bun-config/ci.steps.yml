      - name: Unit tests
        run: bun run test

      - name: Coverage
        run: bun run coverage

      # The merged report (SF: paths rebased to the repo root by `mcoverage
      # merge`) is the single Codecov upload: the components in the generated
      # codecov.yml slice it per package, so no per-package upload steps exist
      # to drift when the workspace changes. Store the token as CODECOV_TOKEN.
      - name: Upload to Codecov (merged monorepo report)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          name: monorepo
          fail_ci_if_error: true

      - name: Coverage summary
        if: always()
        run: bunx mcoverage summary --markdown >> $GITHUB_STEP_SUMMARY
        shell: bash
