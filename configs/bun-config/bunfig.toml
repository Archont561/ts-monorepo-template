[test]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coverageSkipTestFiles = true
# Mirrors COVERAGE_THRESHOLD (80%) in configs/coverage/index.ts, which
# mcoverage check enforces in CI — expressed as a fraction here.
coverageThreshold = { lines = 0.80, functions = 0.80 }
coveragePathIgnorePatterns = [
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/e2e/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/bunup.config.ts",
  "**/playwright.config.ts",
  "**/configs/**",
  "**/src/cli.ts",
  "**/src/e2e.ts",
  "**/src/docs.ts",
  "**/src/collector.ts",
  "**/src/harness.ts",
  "**/src/aggregate.ts",
  "**/src/setup.ts",
  "**/*.node",
  "**/*.wasi.cjs",
  "**/target/**",
  "**/.devcontainer/**",
  "**/apps/example/src/index.ts",
  "**/pages/index.ts",
]