[test]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.80, functions = 0.80 }
coveragePathIgnorePatterns = [
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/e2e/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/bunup.config.ts",
  "**/playwright.config.ts",
  "**/configs/**",
  "**/src/cli.ts",
  "**/src/coverage.ts",
  "**/src/e2e.ts",
  "**/src/act.ts",
  "**/src/docs.ts",
  "**/src/changeset.ts",
  "**/src/collector.ts",
  "**/src/harness.ts",
]