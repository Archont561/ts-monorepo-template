# AUTO-GENERATED from configs/stale/stale.base.yml — do not edit directly
# Edit skeleton then run bun run docs:sync (m docs)
name: Stale

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: "This issue is stale — it has had no activity for 60 days. Please comment if it's still relevant, or it will be closed in 14 days."
          stale-pr-message: "This PR is stale — it has had no activity for 30 days. Please update if it's still relevant, or it will be closed in 14 days."
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          days-before-stale: 60
          days-before-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          exempt-issue-labels: "pinned,security,enhancement"
          exempt-pr-labels: "pinned,security"
          enable-statistics: true
          labels-to-remove-when-unstale: "stale"
