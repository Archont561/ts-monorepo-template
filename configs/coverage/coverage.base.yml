# AUTO-GENERATED from configs/*/coverage.steps.yml — do not edit directly
# Edit fragments in configs/*/coverage.steps.yml then run bun run docs:sync (m docs)
# Coverage reporting: LCOV + HTML via genhtml, artifact upload, threshold check, PR comment
# Deploys to GitHub Pages on main when Pages app not enabled (standalone coverage site)
# When Pages app is enabled, coverage is included at /coverage/ via pages.steps.yml
name: Coverage Report

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: {{BUN_VERSION}}

      - name: Install dependencies
        run: bun install --frozen-lockfile

{{STEPS}}
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (coverage HTML)
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage/html/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (coverage)
        uses: actions/deploy-pages@v4
        id: deployment
