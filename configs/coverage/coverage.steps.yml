      # Standalone coverage Pages site (used when the pages config is disabled).
      # Every step delegates to the mcoverage CLI — no inline shell.
      - name: Collect coverage (Bun + Rust)
        run: mcoverage collect
        shell: bash

      - name: Setup coverage tooling
        run: mcoverage setup
        shell: bash

      - name: Generate coverage HTML
        run: mcoverage html
        shell: bash

      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html/
          retention-days: 14

      # Threshold comes from COVERAGE_THRESHOLD in configs/coverage/index.ts.
      - name: Check coverage threshold (mcoverage)
        run: mcoverage check
        shell: bash

      - name: Report coverage to PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true
