      # Standalone coverage Pages site (used when the pages config is disabled).
      # Every step delegates to the m coverage CLI — no inline shell.
      - name: Collect coverage (Bun + Rust)
        run: bunx m coverage collect
        shell: bash

      - name: Setup coverage tooling
        run: bunx m coverage setup
        shell: bash

      - name: Generate coverage HTML
        run: bunx m coverage html
        shell: bash

      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html/
          retention-days: 14

      # Threshold comes from COVERAGE_THRESHOLD in configs/coverage/index.ts.
      - name: Check coverage threshold (m coverage)
        run: bunx m coverage check
        shell: bash

      - name: Report coverage to PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

      # Single merged upload (root-relative SF: paths) — the codecov.yml
      # components provide per-package statuses from it. Store the token as
      # CODECOV_TOKEN.
      - name: Upload to Codecov (merged monorepo report)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          name: monorepo
          fail_ci_if_error: true

      - name: Coverage summary
        if: always()
        run: bunx m coverage summary --markdown >> $GITHUB_STEP_SUMMARY
        shell: bash
