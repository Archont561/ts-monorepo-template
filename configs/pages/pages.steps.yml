      # TEMPLATE-ONLY:START(pages)
      # Site build + base path live in the mpages CLI (configs/pages/src/cli.ts).
      # Assets are built per package/app by `bun run build` — there is no global
      # CSS step here, apps own their own (e.g. apps/example's build:css).
      - name: Build static site for Pages
        run: mpages build
        shell: bash

      - name: Configure base path for Pages (repo name)
        run: mpages base
        shell: bash
