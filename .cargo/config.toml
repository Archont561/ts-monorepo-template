# Cargo config for the repo-root Cargo workspace (Cargo.toml + crates/ live at ./)
# The offline vendored override is generated on demand by `pixi run fetch-vendor` — never committed.

[build]
# Uncomment to use faster linker if available (mold, lld)
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# For cross-compilation with cargo-zigbuild:
# [target.aarch64-unknown-linux-gnu]
# linker = "aarch64-linux-gnu-gcc"

[env]
# RUST_BACKTRACE = "1"
