name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        if: ${{ !env.ACT }}
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: ${{ !env.ACT }}
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
        if: ${{ !env.ACT }}

      - run: bun run build
        if: ${{ !env.ACT }}

      - uses: changesets/action@v1
        if: ${{ !env.ACT }}
        with:
          publish: bun run release
          version: bun run version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # TEMPLATE-ONLY:START(native)
      - name: Setup Rust toolchain (release)
        if: hashFiles('packages/native/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads

      - name: Rust cache (release)
        if: hashFiles('packages/native/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/native"

      - name: Cargo build release (m native)
        if: hashFiles('packages/native/Cargo.toml') != ''
        run: bunx m native build:release
        shell: bash

      - name: Build native bindings for release (napi via m native)
        if: hashFiles('packages/native/Cargo.toml') != ''
        run: bunx m native napi:build
        shell: bash
      # TEMPLATE-ONLY:END(native)
