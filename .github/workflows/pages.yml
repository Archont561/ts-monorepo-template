name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TEMPLATE-ONLY:START(pages)
      # Collects coverage if needed, renders HTML and copies it into the Pages
      # artifact so it is served at /coverage/ — all inside mcoverage pages.
      - name: Publish coverage to Pages (mcoverage)
        run: mcoverage pages
        shell: bash
      # TEMPLATE-ONLY:END(pages)

      # TEMPLATE-ONLY:START(pages)
      # Site build + base path live in the mpages CLI (configs/pages/src/cli.ts).
      # Assets are built per package/app by `bun run build` — there is no global
      # CSS step here, apps own their own (e.g. apps/example's build:css).
      - name: Build static site for Pages
        run: mpages build
        shell: bash

      - name: Configure base path for Pages (repo name)
        run: mpages base
        shell: bash
      # TEMPLATE-ONLY:END(pages)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./apps/example/public"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
