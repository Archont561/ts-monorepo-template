name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Coverage
        run: bun run coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Validate workflows
        run: bun run ci:lint

# TEMPLATE-ONLY:START(native)
- name: Setup Rust toolchain
  if: hashFiles('Cargo.toml') != '' || hashFiles('packages/native/Cargo.toml') != ''
  uses: dtolnay/rust-toolchain@stable
  with:
    components: clippy, rustfmt
    targets: wasm32-wasip1-threads

- name: Rust cache
  if: hashFiles('Cargo.toml') != '' || hashFiles('packages/native/Cargo.toml') != ''
  uses: Swatinem/rust-cache@v2

- name: Cargo fmt check
  if: hashFiles('Cargo.toml') != '' || hashFiles('packages/native/Cargo.toml') != ''
  run: cargo fmt --all -- --check
  shell: bash

- name: Cargo clippy (deny warnings)
  if: hashFiles('Cargo.toml') != '' || hashFiles('packages/native/Cargo.toml') != ''
  run: cargo clippy --workspace -- -D warnings
  shell: bash

- name: Cargo check (fast type-check)
  if: hashFiles('Cargo.toml') != '' || hashFiles('packages/native/Cargo.toml') != ''
  run: cargo check --workspace
  shell: bash

- name: Cargo test (workspace)
  if: hashFiles('Cargo.toml') != '' || hashFiles('packages/native/Cargo.toml') != ''
  run: cargo test --workspace --profile ci || cargo test --workspace
  shell: bash

- name: Build native bindings (host)
  if: hashFiles('packages/native/Cargo.toml') != ''
  run: |
    echo "🦀 Building native bindings for current host"
    bun run build:native || echo "native build skipped (install Rust)"
  shell: bash

- name: Check native package types
  if: hashFiles('packages/native/package.json') != ''
  run: bun --filter @myorg/native run typecheck || echo "native typecheck skipped"
  shell: bash
# TEMPLATE-ONLY:END(native)

      - name: E2E tests
        run: bun run test:e2e

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
