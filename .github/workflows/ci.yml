name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Coverage
        run: bun run coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Validate workflows
        run: bun run ci:lint

# TEMPLATE-ONLY:START(native)
- name: Build native bindings (host)
  if: hashFiles('packages/native/Cargo.toml') != ''
  run: |
    echo "🦀 Checking Rust toolchain"
    rustc --version || echo "Rust not installed, skipping native build in CI lint"
    cargo --version || true
    # In full CI, build per matrix:
    # bun run build:native
  shell: bash

- name: Check native package types
  if: hashFiles('packages/native/package.json') != ''
  run: bun --filter @myorg/native run typecheck || echo "native typecheck skipped"
  shell: bash
# TEMPLATE-ONLY:END(native)

      - name: E2E tests
        run: bun run test:e2e

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
