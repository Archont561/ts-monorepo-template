name: Sandbox Bundle

# Builds the offline sandbox bundle: the pixi environment packed for
# distribution (act + actionlint + podman + rust) and the cargo vendor tree
# that Cargo builds against when the network is blocked. `m sandbox setup
# --archive ...` fetches this bundle and unpacks it on a machine that has never
# spoken to a conda channel.
#
# Manual only — the job packs every system binary into one archive, so a
# maintainer starts it when pixi.toml, pixi.lock or Cargo.lock change.
on:
  workflow_dispatch:

concurrency:
  group: sandbox-bundle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    name: Pack environment + vendor
    runs-on: ubuntu-latest
    env:
      # The pixi installer writes here; its bin/ is added to GITHUB_PATH below.
      PIXI_HOME: ${{ github.workspace }}/.pixi
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pixi standalone at the pinned version — the installer honors
      # PIXI_VERSION exactly the way `m sandbox setup` pins it on a developer
      # machine, so the bundle and its consumer run the same binary.
      - name: Install pixi (v0.72.2)
        env:
          PIXI_VERSION: v0.72.2
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "${PIXI_HOME}/bin" >> "${GITHUB_PATH}"

      # Frozen — the committed lock IS the bundle, so manifest/lock drift must
      # fail here loudly instead of silently changing what ships.
      - name: Install the environment (locked)
        run: pixi install --frozen

      # `pixi run fetch-vendor` = `cargo vendor vendor` against Cargo.lock.
      # A native-less repo has no lock (the native feature is pruned), so the
      # bundle would be a mixed bag — thus the whole workflow is gated on the
      # native feature in the aggregator.
      - name: Rebuild the cargo vendor tree
        run: pixi run fetch-vendor

      - name: Pack the pixi environment
        run: pixi run pack

      - name: Archive the vendor tree
        run: tar -czf vendor.tar.gz vendor

      - name: Upload the sandbox bundle
        uses: actions/upload-artifact@v6
        with:
          name: sandbox-bundle
          path: |
            environment.tar
            vendor.tar.gz
          if-no-files-found: error
