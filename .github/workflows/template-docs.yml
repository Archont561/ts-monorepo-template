# TEMPLATE-ONLY:START(template)
# Template-only docs Pages — deploys docs/ to GitHub Pages
# Removed during scaffolding via configs/template extraRemovals
# This is separate from configs/pages/pages.yml (which deploys apps/example)
# For template repo: docs/ is static template documentation
# For generated monorepos: this file is removed, pages.yml is used if opt-in
name: Template Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/template-docs.yml"
      - "README.md"
      - "AGENTS.md"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "template-docs"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for VitePress lastUpdated

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload template docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/.vitepress/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# TEMPLATE-ONLY:END(template)
