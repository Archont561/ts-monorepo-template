# TEMPLATE-ONLY:START(template)
# Template-only docs Pages — deploys docs/ to GitHub Pages
# Removed during scaffolding via configs/template extraRemovals
# This is the ONLY Pages deployment for this repository: `mdocs site` assembles
# docs + the coverage report (/coverage/) + the demo app (/example/) into one
# artifact, so pages.yml and coverage.yml are not generated here (see
# configs/template/src/aggregate.ts). Generated monorepos, which have no docs/,
# get pages.yml (and coverage.yml when Pages is off) as usual.
name: Template Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "packages/**"
      - "apps/**"
      - "configs/**"
      - ".github/workflows/template-docs.yml"
      - "README.md"
      - "AGENTS.md"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "template-docs"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for VitePress lastUpdated

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs the suite with coverage, renders the HTML report into the site,
      # builds the docs and nests the demo app under /example/.
      - name: Build the site (docs + coverage + demo app)
        run: bunx mdocs site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload template docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/.vitepress/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# TEMPLATE-ONLY:END(template)
