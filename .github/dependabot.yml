# AUTO-GENERATED from packages/tooling/src/ci/fragments/dependabot/ — do not edit directly
# Edit those fragments then run bun run docs:sync (m docs)
version: 2
updates:
  # npm — Bun workspaces (package.json / bun.lock)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "biome*"
          - "turbo"
          - "playwright*"
        update-types:
          - "minor"
          - "patch"
      dev-tooling:
        patterns:
          - "@types/*"
          - "biome*"
          - "turbo"
          - "playwright*"
          - "typescript"
          - "@myorg/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Cargo — Rust package (packages/native/Cargo.toml) self-contained, no root Cargo.toml
  - package-ecosystem: "cargo"
    directory: "/packages/native"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "cargo"
      - "rust"
    groups:
      cargo-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions — .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker — Dockerfile in apps/example
  - package-ecosystem: "docker"
    directory: "/apps/example"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"

