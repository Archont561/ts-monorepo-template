name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs are pure waste — only keep the latest per branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Split into one job per concern so a slow or failing native build cannot hold
# up coverage, and so each job carries only the permissions it needs.
# TEMPLATE-ONLY:START(template)
#
# How this file is assembled (template repo only — the generator does not ship):
# step fragments declare their job with a `# SECTION: <name>` comment and are
# spliced at the matching marker below; a job left with nothing but the
# bootstrap is dropped and the gate's `needs` is rewritten to match. The
# BOOTSTRAP placeholder is the checkout/setup/cache/install preamble, kept in
# ci.bootstrap.yml as a single copy so a version or cache change lands in every
# job at once. See packages/tooling/src/scaffold/aggregator.ts.
# TEMPLATE-ONLY:END(template)
jobs:
  quality:
    name: Quality & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
{{BOOTSTRAP}}

# SECTION: quality

  coverage:
    name: Coverage Gates
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The LCOV reporter comments on the PR with GITHUB_TOKEN.
      pull-requests: write
    steps:
{{BOOTSTRAP}}

# SECTION: coverage

  security:
    name: Security Scans
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # TEMPLATE-ONLY:START(codeql,trivy)
      # SARIF results published into GitHub code scanning. Scoped to the two
      # opt-ins that produce them, so a project using neither is not granted it.
      security-events: write
      # TEMPLATE-ONLY:END(codeql,trivy)
      # Secret-scanning findings are posted as PR comments.
      pull-requests: write
    steps:
{{BOOTSTRAP}}

# SECTION: security

  # No job-level `hashFiles` guard: the function is not available there (the
  # runner rejects it before any checkout exists), so the individual steps keep
  # their own `hashFiles` guards and skip themselves. The job is removed
  # entirely by the generator when the native config is absent.
  native:
    name: Native FFI Validation
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
{{BOOTSTRAP}}

# SECTION: native

  e2e:
    name: End-to-End Tests
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
{{BOOTSTRAP}}

# SECTION: e2e

  gate:
    name: Quality Gate
    needs: [quality, coverage, security, native, e2e]
    # Runs even when an upstream job failed so the run still reports a single
    # status branch protection can require. `needs.*.result` is the object-filter
    # form — a shell loop over `${{ needs[job].result }}` would never interpolate,
    # because expressions resolve when the job is parsed, not at runtime. The
    # generator rewrites the list above when it prunes a job.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Evaluate upstream job results
        shell: bash
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "upstream job results: $results"
          if echo "$results" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::An upstream job did not succeed"
            exit 1
          fi
