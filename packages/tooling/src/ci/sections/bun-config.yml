# SECTION: quality
      - name: Unit tests
        run: bun run test

# SECTION: coverage
      - name: Coverage
        run: bun run coverage

      # The merged report (SF: paths rebased to the repo root by `m coverage
      # merge`) is the single Codecov upload: the components in the generated
      # codecov.yml slice it per package, so no per-package upload steps exist
      # to drift when the workspace changes. Store the token as CODECOV_TOKEN.
      - name: Upload to Codecov (merged monorepo report)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          name: monorepo
          fail_ci_if_error: true

      - name: Coverage summary
        if: always()
        run: bunx m coverage summary --markdown >> $GITHUB_STEP_SUMMARY
        shell: bash

# SECTION: quality
      # TEMPLATE-ONLY:START(template)
      # packages/tooling/dist/ is committed because `bun-create.preinstall` runs
      # it straight off the tarball, before node_modules exists. Nothing else in
      # CI would notice it drifting from src/, so rebuild and require a clean
      # diff. Runs after install (deps resolved) and after check/test (source is
      # known good), and before anything downstream consumes the scaffolder.
      # Scoped `template` — a generated project keeps the tooling package but
      # drops the bundle, so this step must not survive into one.
      - name: Validate Scaffolder Bundle Integrity
        run: |
          bun run --filter @myorg/tooling build
          if ! git diff --exit-code packages/tooling/dist; then
            echo "::error::Scaffolder bundle is out of sync with source. Run 'bun run --filter @myorg/tooling build' and commit the result."
            exit 1
          fi
      # TEMPLATE-ONLY:END(template)
