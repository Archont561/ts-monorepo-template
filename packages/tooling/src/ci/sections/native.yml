# SECTION: native
      # TEMPLATE-ONLY:START(native)
      - name: Setup Rust toolchain
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads

      - name: Rust cache
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "{{NATIVE_DIR}}"

      - name: Cargo fmt check (mnative)
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        run: bunx mnative fmt:check
        shell: bash

      - name: Cargo clippy (deny warnings, mnative)
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        run: bunx mnative clippy
        shell: bash

      - name: Cargo check (fast, mnative)
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        run: bunx mnative check
        shell: bash

      - name: Cargo test (mnative)
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        run: bunx mnative test
        shell: bash

      - name: Build native bindings (host, mnative)
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        run: bunx mnative napi:build
        shell: bash

      - name: Check native package types
        if: hashFiles('{{NATIVE_NPM}}') != ''
        run: bunx mnative typecheck
        shell: bash
      # TEMPLATE-ONLY:END(native)
