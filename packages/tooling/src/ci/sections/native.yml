# SECTION: native
      # TEMPLATE-ONLY:START(native)
      - name: Setup Rust toolchain
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads

      - name: Rust cache
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "{{NATIVE_DIR}}"

      - name: Cargo fmt check (m native)
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        run: bunx m native fmt:check
        shell: bash

      - name: Cargo clippy (deny warnings, m native)
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        run: bunx m native clippy
        shell: bash

      - name: Cargo check (fast, m native)
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        run: bunx m native check
        shell: bash

      - name: Cargo test (m native)
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        run: bunx m native test
        shell: bash

      - name: Build native bindings (host, m native)
        if: hashFiles('{{NATIVE_CARGO}}') != ''
        run: bunx m native napi:build
        shell: bash

      - name: Check native package types
        if: hashFiles('{{NATIVE_NPM}}') != ''
        run: bunx m native typecheck
        shell: bash
      # TEMPLATE-ONLY:END(native)
