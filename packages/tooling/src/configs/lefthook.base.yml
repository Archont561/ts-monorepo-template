# Shared Git hook configuration — the single source of truth for every hook in
# this repo and in projects generated from it.
#
# The root `lefthook.yml` is generated by `m setup lefthook` and is a one-line
# `extends:` wrapper around this file, so a project can add hooks of its own
# without forking the shared config.
#
# Rules:
#   1. Hooks are an early-warning system; CI is authoritative. A hook whose tool
#      is not installed skips with a warning and never blocks — that behaviour
#      lives in the `m` wrappers (src/utils/tools.ts), not in this file, so the
#      commands here stay one line each.
#   2. No hook performs a network operation.
#   3. pre-commit stays interactive; expensive checks run once per push instead.
#   4. Lefthook passes hook arguments as {1}/{2}/{3} templates. It does NOT pass
#      them as shell positional parameters — `$1` is always empty in a run block.
#   5. `LEFTHOOK=0` bypasses everything.

pre-commit:
  parallel: true
  commands:
    # --no-errors-on-unmatched is load-bearing: a staged path Biome's own config
    # excludes would otherwise abort the commit with "No files were processed".
    # No `md` in the glob — Biome 2.5 errors on Markdown rather than ignoring it.
    biome:
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,jsonc}"
      run: bun run m biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # Skips with a warning when the binary is absent.
    secrets:
      run: bun run m gitleaks protect --staged

    # Two cheap repo guards in one command: unresolved merge markers, and files
    # too large for Git history. Only <<<<<<< and >>>>>>> are matched — a line of
    # `=` is legitimate in Markdown and several config formats.
    #
    # The loop runs in a subshell, so findings are captured via command
    # substitution and the exit status is decided here in the parent.
    guards:
      run: |
        staged=$(git -c core.quotepath=false diff --cached --name-only --diff-filter=ACM)
        [ -n "$staged" ] || exit 0
        limit=${LARGE_FILE_LIMIT:-1048576}
        problems=$(printf '%s\n' "$staged" | while IFS= read -r f; do
          [ -f "$f" ] || continue
          if grep -qE '^(<{7}|>{7})([[:space:]]|$)' "$f" 2>/dev/null; then
            printf '❌ conflict marker: %s\n' "$f"
            continue
          fi
          case "$f" in
            */node_modules/*|node_modules/*|*/dist/*|dist/*|*/.turbo/*|.turbo/*) continue ;;
            */coverage/*|coverage/*|*/.pages/*|.pages/*|*/test-results/*) continue ;;
          esac
          size=$(wc -c < "$f" 2>/dev/null | tr -d ' ')
          if [ -n "$size" ] && [ "$size" -gt "$limit" ]; then
            printf '❌ over %s KB (%s KB): %s\n' "$((limit / 1024))" "$((size / 1024))" "$f"
          fi
        done)
        [ -n "$problems" ] || exit 0
        printf '%s\n' "$problems"
        echo "   Raise the size ceiling with LARGE_FILE_LIMIT=<bytes> if it is deliberate."
        exit 1

    # Skips with a warning when actionlint is unavailable; its npm wrapper
    # downloads the binary on first run and that download is often blocked.
    workflows:
      glob: "{.github/workflows/*.yml,.github/workflows/*.yaml}"
      run: bun run m ci:lint --if-installed

commit-msg:
  commands:
    # Conventional Commits, plus a block on wip/todo.
    #
    # This is commit-msg and not pre-commit because git gives pre-commit no
    # arguments at all and the message does not exist yet — there is nothing to
    # validate. `.git/COMMIT_EDITMSG` is readable at pre-commit time, but it
    # still holds the *previous* commit's message, so checking it there would
    # lint the wrong thing and pass or fail on history.
    #
    # Format itself is delegated to commitlint (`m commitlint` → @commitlint/cli
    # with @commitlint/config-conventional), which is the specification rather
    # than a regex that approximates it. What stays here is the policy
    # commitlint does not express:
    #
    #   - fixup!/squash! are allowed through deliberately: `git commit --fixup`
    #     exists to produce commits that `git rebase -i --autosquash` later
    #     folds in, and rejecting them here breaks that workflow. pre-push is
    #     what stops an unautosquashed fixup reaching the remote.
    #   - wip/todo have no such use, and get a message naming the alternative
    #     instead of commitlint's "type must be one of [...]".
    message:
      run: |
        msg=$(cat {1})
        case "$msg" in
          "Merge "*|"Revert "*|"fixup! "*|"squash! "*|"chore(release):"*) exit 0 ;;
        esac
        if printf '%s' "$msg" | grep -qiE '^[[:space:]]*(wip|todo)([[:space:]:!]|$)'; then
          echo "❌ WIP/TODO commits are not allowed."
          echo "   Use 'git commit --fixup=<sha>' for a scratch commit you intend to fold in."
          exit 1
        fi
        bun run m commitlint {1}

# Sequential, not parallel: Turbo parallelises internally, and four interleaved
# logs make a failure hard to read. Measured here: ~21s.
pre-push:
  commands:
    # `bun run typecheck` / `bun run test`, not `m typecheck` / `m test`. The
    # latter are bare tsc / bun test at the repo root: tsc has no tsconfig there,
    # and `bun test` collects every workspace's specs with the wrong cwd, which
    # fails specs that resolve paths relative to cwd.
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
    health:
      run: bun run m health
    # Formatting moved here from pre-commit to keep that hook minimal; it is
    # still enforced, just once per push. Every subcommand self-skips with a
    # warning when the toolchain is absent, and the guard keeps a project without
    # a native workspace from even trying.
    native:
      run: |
        test -f packages/native/Cargo.toml || exit 0
        bun run m native fmt:check && bun run m native check && bun run m native clippy
    # Falls back to the remote's default branch for a branch with no upstream,
    # and skips if nothing resolves (shallow clone, first push).
    unsquashed:
      run: |
        upstream=$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null) || upstream=""
        if [ -z "$upstream" ]; then
          upstream=$(git rev-parse --abbrev-ref origin/HEAD 2>/dev/null | sed 's|^origin/||')
          [ -n "$upstream" ] && upstream="origin/$upstream" || upstream=origin/main
        fi
        git rev-parse --verify "$upstream" >/dev/null 2>&1 || exit 0
        bad=$(git log --format='%h %s' "$upstream"..HEAD \
          | grep -iE '^[0-9a-f]+ ((fixup|squash)!|(wip|todo)([ :!]|$))' || true)
        if [ -n "$bad" ]; then
          echo "❌ Refusing to push commits that should be folded in or removed:"
          printf '%s\n' "$bad" | sed 's/^/   /'
          echo "   Fix: git rebase -i --autosquash $upstream"
          exit 1
        fi

# Install dependencies when a lockfile moved. Only bun.lock is tracked today;
# the Cargo paths are listed so a project that commits one needs no edit here.
post-checkout:
  commands:
    install:
      # {1} = previous HEAD, {2} = new HEAD, {3} = 1 for a branch checkout.
      run: |
        [ "{3}" = "1" ] || exit 0
        git diff --quiet "{1}" "{2}" -- bun.lock Cargo.lock packages/native/Cargo.lock 2>/dev/null \
          || { echo "🔒 Lockfile changed — running bun install"; bun install; }

post-merge:
  commands:
    install:
      run: |
        git rev-parse --verify ORIG_HEAD >/dev/null 2>&1 || exit 0
        git diff --quiet ORIG_HEAD HEAD -- bun.lock Cargo.lock packages/native/Cargo.lock 2>/dev/null \
          || { echo "🔒 Lockfile changed — running bun install"; bun install; }

post-rewrite:
  commands:
    install:
      run: |
        git rev-parse --verify ORIG_HEAD >/dev/null 2>&1 || exit 0
        git diff --quiet ORIG_HEAD HEAD -- bun.lock Cargo.lock packages/native/Cargo.lock 2>/dev/null \
          || { echo "🔒 Lockfile changed — running bun install"; bun install; }
