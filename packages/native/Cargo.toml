[package]
name = "native"
version = "0.1.0"
edition = "2021"
description = "Native Rust bindings for @myorg/external — napi-rs with WASM fallback"
license = "MIT"
repository = "https://github.com/Archont561/ts-monorepo-template"

[lib]
crate-type = ["cdylib"]
name = "native"

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[features]
default = []

# Profiles inherit from workspace root (Cargo.toml)
# [profile.release] defined in workspace root with lto, codegen-units, strip
# [profile.dev] defined in workspace root
# [profile.ci] for faster CI builds
