# Virtual Cargo workspace — no [package] here, only members.
# Everything Rust lives under packages/native, so the repo root stays clean.
[workspace]
resolver = "3"
members = [
  "crates/native",
  "crates/shared",
]

[workspace.package]
edition    = "2024"
version    = "0.1.0"
license    = "MIT"
repository = "https://github.com/Archont561/ts-monorepo-template"

[workspace.dependencies]
# napi crates — pinned together
napi         = { version = "3", features = ["napi4"] }
napi-derive  = "3"
napi-build   = "2"
shared       = { path = "crates/shared" }

[workspace.lints.rust]
# pedantic is left off on purpose: #[napi] generates code that trips it,
# and CI runs clippy with -D warnings.
#
# deny, NOT forbid. `#[napi]` expands to `unsafe` code wrapped in its own
# `#[allow(unsafe_code)]`, and `forbid` is by definition unoverruled by an inner
# `allow` — so with `forbid` every `#[napi]` attribute fails to compile with
# E0453 "allow(unsafe_code) incompatible with previous forbid", which then
# cascades into E0425 for everything the aborted expansion never generated.
# `deny` keeps the guarantee we actually want (any `unsafe` we write is a hard
# error) while letting a proc macro relax it for the code it emits.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# Release binaries — `mnative build:release` and every `napi build --release`.
[profile.release]
lto           = true
codegen-units = 1
strip         = true

# CI builds — `mnative build:ci`: fast to produce, fast to run.
[profile.ci]
inherits   = "dev"
opt-level  = 1
