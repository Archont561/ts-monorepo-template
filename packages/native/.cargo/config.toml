# Cargo config — self-contained, no root Cargo.toml
# All Rust code lives in packages/native/Cargo.toml

[build]
# Uncomment to use faster linker if available (mold, lld)
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# For cross-compilation with cargo-zigbuild:
# [target.aarch64-unknown-linux-gnu]
# linker = "aarch64-linux-gnu-gcc"

[env]
# RUST_BACKTRACE = "1"
